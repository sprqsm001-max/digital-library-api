<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reading Card - Old African Books</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-logo" onclick="location.href='index.html'">
          <img src="images/logo-transparent.png?v=2" alt="Logo">
          <h1>Old African Books</h1>
        </div>
        <div class="header-actions">
           <button class="user-btn" id="user-status-btn">
             <!-- Populated by main.js -->
           </button>
        </div>
      </div>
    </header>

    <main class="view-content">
      <div style="margin-bottom: 24px;">
        <h2 style="font-family: var(--font-display); font-size: 1.8rem; color: var(--bg-navy);">My Reading Card</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Manage your loans, bookmarks and reading history.</p>
      </div>

      <!-- Shelf Tabs -->
      <div class="admin-tabs" style="margin-bottom: 20px;">
        <button class="admin-tab active" id="tab-loans" onclick="switchShelfTab('loans')">Active Loans</button>
        <button class="admin-tab" id="tab-bookmarks" onclick="switchShelfTab('bookmarks')">Bookmarks</button>
        <button class="admin-tab" id="tab-history" onclick="switchShelfTab('history')">Timeline</button>
      </div>

      <!-- Tab Content: Active Loans -->
      <div id="panel-loans" class="admin-tab-content active">
        <div class="books-grid-list" id="loans-list">
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">Syncing your card...</div>
        </div>
      </div>

      <!-- Tab Content: Bookmarks -->
      <div id="panel-bookmarks" class="admin-tab-content">
        <div class="books-grid-list" id="bookmarks-list">
          <!-- Populated -->
        </div>
      </div>

      <!-- Tab Content: History -->
      <div id="panel-history" class="admin-tab-content">
        <div class="books-grid-list" id="history-list">
          <!-- Populated -->
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-logo-section" onclick="location.href='index.html'" style="cursor: pointer;">
        <img src="images/logo-transparent.png?v=2" alt="Old African Books" class="footer-logo">
        <h2>Old African Books</h2>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="search.html">Catalog</a>
        <a href="admin.html">Staff</a>
      </div>
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">&copy; 2026 Old African Books.</p>
    </footer>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="search.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Search
      </a>
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Library
      </a>
      <button class="nav-item libby-menu-btn" onclick="if(window.API && window.API.isAuthenticated()) { showUserOptionsSheet(window.API.getUser()); } else { window.location.href='login.html'; }">
        <div class="libby-menu-circle">
          <svg viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
      </button>
      <a href="shelf.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        Shelf
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const startTab = params.get('tab');
      if (startTab && ['loans', 'bookmarks', 'history'].includes(startTab)) {
        switchShelfTab(startTab);
      } else {
        switchShelfTab('loans');
      }
    });

    async function switchShelfTab(tabName) {
      document.querySelectorAll('.admin-tabs .admin-tab').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.admin-tab-content').forEach(p => p.classList.remove('active'));

      let tabButtonId = 'tab-loans';
      let panelId = 'panel-loans';

      if (tabName === 'bookmarks') {
        tabButtonId = 'tab-bookmarks';
        panelId = 'panel-bookmarks';
        await loadBookmarks();
      } else if (tabName === 'history') {
        tabButtonId = 'tab-history';
        panelId = 'panel-history';
        await loadHistory();
      } else {
        await loadLoans();
      }

      const activeBtn = document.getElementById(tabButtonId);
      const activePanel = document.getElementById(panelId);
      if (activeBtn) activeBtn.classList.add('active');
      if (activePanel) activePanel.classList.add('active');

      const newUrl = `${window.location.pathname}?tab=${tabName}`;
      window.history.pushState({ path: newUrl }, '', newUrl);
    }

    async function loadLoans() {
      const container = document.getElementById('loans-list');
      try {
        const history = await API.getReadingHistory();
        const loans = history.filter(h => h.progress_percent < 100);

        if (loans.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
              <p style="margin-bottom: 16px;">You have no active loans right now.</p>
              <a href="index.html" class="btn btn-primary btn-sm">Browse Catalog</a>
            </div>
          `;
          return;
        }

        container.innerHTML = loans.map(item => {
          const book = item.book;
          const progress = item.progress_percent || 0;
          return `
            <div class="book-list-item">
              <img class="book-list-cover" src="${getBookCover(book)}" alt="${book.title}" onclick="location.href='book.html?id=${book.id}'">
              <div class="book-list-info">
                <h3 class="book-list-title"><a href="book.html?id=${book.id}">${book.title}</a></h3>
                <p class="book-list-author">by ${book.author}</p>
                <div style="margin-top: 8px; max-width: 250px;">
                  <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-secondary); margin-bottom: 2px;">
                    <span>Reading Progress</span>
                    <span>${progress}%</span>
                  </div>
                  <div style="width: 100%; height: 6px; background-color: var(--border-color); border-radius:3px; overflow:hidden;">
                    <div style="width: ${progress}%; height:100%; background-color: var(--accent-teal);"></div>
                  </div>
                </div>
              </div>
              <div class="book-list-actions">
                <a href="read.html?id=${book.id}" class="btn btn-coral btn-sm">Read</a>
                <button onclick="returnBook(${book.id})" class="btn btn-secondary btn-sm">Return</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:var(--accent-coral); text-align:center; padding:20px;">Could not reload your bookshelf loans.</p>`;
      }
    }

    async function loadBookmarks() {
      const container = document.getElementById('bookmarks-list');
      try {
        const bookmarks = await API.getBookmarks();

        if (bookmarks.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
              <p style="margin-bottom: 16px;">No bookmarked items found.</p>
              <a href="search.html" class="btn btn-secondary btn-sm">Search Catalog</a>
            </div>
          `;
          return;
        }

        container.innerHTML = bookmarks.map(item => {
          const book = item.book;
          return `
            <div class="book-list-item">
              <img class="book-list-cover" src="${getBookCover(book)}" alt="${book.title}" onclick="location.href='book.html?id=${book.id}'">
              <div class="book-list-info">
                <h3 class="book-list-title"><a href="book.html?id=${book.id}">${book.title}</a></h3>
                <p class="book-list-author">by ${book.author}</p>
              </div>
              <div class="book-list-actions">
                <a href="book.html?id=${book.id}" class="btn btn-outline btn-sm">Borrow</a>
                <button onclick="removeBookmark(${book.id})" class="btn btn-secondary btn-sm" style="color: var(--accent-coral); border-color: var(--border-color);">&times; Remove</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:var(--accent-coral); text-align:center; padding:20px;">Could not reload bookmarks.</p>`;
      }
    }

    async function loadHistory() {
      const container = document.getElementById('history-list');
      try {
        const history = await API.getReadingHistory();

        if (history.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">
              <p style="margin-bottom: 16px;">You haven't read any books on this card yet.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = history.map(item => {
          const book = item.book;
          const dateStr = item.last_read_at ? new Date(item.last_read_at).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'}) : 'Recently';
          const isDone = item.progress_percent >= 100;
          return `
            <div class="book-list-item">
              <img class="book-list-cover" src="${getBookCover(book)}" alt="${book.title}" onclick="location.href='book.html?id=${book.id}'">
              <div class="book-list-info">
                <h3 class="book-list-title"><a href="book.html?id=${book.id}">${book.title}</a></h3>
                <p class="book-list-author">by ${book.author}</p>
                <p class="book-list-meta" style="display:flex; align-items:center; gap:8px;">
                  <span>Opened: <strong>${dateStr}</strong></span>
                  ${isDone ? '<span style="color: var(--accent-teal); font-weight:700;">Completed</span>' : `<span>Progress: ${item.progress_percent || 0}%</span>`}
                </p>
              </div>
              <div class="book-list-actions">
                <a href="book.html?id=${book.id}" class="btn btn-secondary btn-sm">Details</a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:var(--accent-coral); text-align:center; padding:20px;">Could not reload history timeline.</p>`;
      }
    }

    async function removeBookmark(id) {
      try {
        await API.deleteBookmark(id);
        showToast('Bookmark removed');
        loadBookmarks();
      } catch (e) {
        showToast('Operation failed', 'error');
      }
    }

    async function returnBook(id) {
      try {
        await API.updateReadingHistory(id, 100);
        showToast('Book returned to the shelves. Thanks!');
        loadLoans();
      } catch (e) {
        showToast('Operation failed', 'error');
      }
    }
  </script>
</body>
</html>
